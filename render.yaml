services:
  - type: web
    name: chemshop
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_data && gunicorn chemshop.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: chemshop-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: chemshop-db
    databaseName: chemshop
    databaseUser: chemshop_user
