{% extends 'store/base.html' %}
{% block title %}Вход — ХимМаркет{% endblock %}
{% block content %}

<div style="max-width: 450px; margin: 50px auto;">
    <div class="card" style="padding: 40px 35px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="font-size: 60px; margin-bottom: 10px;">👤</div>
            <h2 style="color: #667eea; margin-bottom: 10px;">Вход в аккаунт</h2>
            <p style="color: #888;">Введите свои данные для входа</p>
        </div>

        <form method="post" style="display: flex; flex-direction: column; gap: 20px;">
            {% csrf_token %}
            
            <div>
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #555;">
                    📧 Имя пользователя
                </label>
                <input type="text" name="username" required 
                       placeholder="Введите имя пользователя"
                       style="width: 100%; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; transition: all 0.3s ease;">
            </div>

            <div>
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #555;">
                    🔒 Пароль
                </label>
                <input type="password" name="password" required 
                       placeholder="Введите пароль"
                       style="width: 100%; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; transition: all 0.3s ease;">
            </div>

            {% if form.errors %}
            <div class="message error" style="padding: 12px 15px; border-radius: 8px; font-size: 14px;">
                ⚠️ {{ form.errors }}
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary" 
                    style="width: 100%; padding: 15px; font-size: 16px; margin-top: 10px;">
                🔐 Войти
            </button>
        </form>

        <div style="text-align: center; margin-top: 25px; padding-top: 25px; border-top: 1px solid #eee;">
            <p style="color: #666; margin-bottom: 15px;">Нет аккаунта?</p>
            <a href="{% url 'store:register' %}" class="btn btn-success" 
               style="display: inline-block; min-width: 200px;">
                ✨ Зарегистрироваться
            </a>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="{% url 'store:home' %}" style="color: #667eea; text-decoration: none; font-size: 14px;">
                ← Вернуться на главную
            </a>
        </div>
    </div>
</div>

{% endblock %}
